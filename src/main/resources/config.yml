schema-version: 12
prefix: '&b[Yeti] &7'
boss:
  name: 'Cyborg Father Yeti'
  health: 700.0
  golem-scale: 1.0
  model-scale: 6.4
  movement-speed: 0.24
  arena-radius: 64.0
  leash-radius: 80.0
  idle-despawn-seconds: 180
  maximum-duration-seconds: 1800
mother:
  enabled: true
  name: 'Mother Yeti'
  # Summoned once at Father's 50% HP; her max HP is this fraction of Father's.
  health-fraction: 0.25
  # Relative to Father; accepted range is 0.5 to below 1.0.
  size-multiplier: 0.75
attacks:
  sonic-boom:
    weight: 3
    cooldown-ticks: 280
    windup-ticks: 45
    damage: 12.0
    knockback: 1.1
  charge:
    weight: 4
    cooldown-ticks: 200
    windup-ticks: 30
    damage: 10.0
    knockback: 1.2
  roar:
    weight: 2
    cooldown-ticks: 260
    windup-ticks: 45
    damage: 4.0
    radius: 7.0
    knockback: 0.9
    slow-ticks: 60
  grab-slam:
    weight: 2
    cooldown-ticks: 240
    windup-ticks: 35
    range: 5.0
    damage: 14.0
    knockback: 0.5
  global-cooldown-ticks: 25
  ice-ball:
    weight: 5
    cooldown-ticks: 90
    windup-ticks: 25
    damage: 6.0
    speed: 1.3
    knockback: 0.6
    slow-ticks: 40
  swipe:
    weight: 4
    cooldown-ticks: 60
    windup-ticks: 20
    damage: 9.0
    range: 5.0
    knockback: 0.8
  slam:
    weight: 2
    cooldown-ticks: 150
    windup-ticks: 40
    damage: 12.0
    radius: 7.0
    knockback: 1.1
  barrage:
    weight: 3
    cooldown-ticks: 220
    windup-ticks: 35
    damage: 5.0
    speed: 1.4
    knockback: 0.5
    slow-ticks: 30
    count: 4
    interval-ticks: 10
  snow-golems:
    weight: 2
    cooldown-ticks: 320
    windup-ticks: 40
minions:
  snow-golems:
    enabled: true
    maximum: 4
    per-wave: 2
    health: 25.0
    barrage-count: 4
    barrage-cooldown-ticks: 120
    barrage-interval-ticks: 10
    damage: 3.0
    slow-ticks: 60
  ice-warden:
    enabled: true
    health: 200.0
    damage: 12.0
    movement-speed: 0.18
    attack-cooldown-ticks: 60
    slow-ticks: 60
rewards:
  # XP points, not levels. Anyone who deals accepted positive damage participates.
  experience: 3000
  sword:
    name: '&bFrostfang'
    damage-enchantment-level: 5
    frost-chance: 0.2
    frost-cooldown-ticks: 80
    slow-ticks: 60
snowfall:
  enabled: true
  duration-seconds: 300
  particles-per-player: 12

resource-pack:
  # Dedicated pack, independent of the CosmeticPets pack.
  url: 'https://github.com/aemiroo/YetiBoss/releases/download/yeti-pack/YetiBoss-Pack.zip'
bedrock:
  # Enable only after installing the boss Bedrock pack and both boss mappings.
  enabled: false

# Natural ice-biome spawns. Five-minute interval for testing; set to 3.0 for production.
schedule:
  enabled: true
  interval-hours: 0.08333333333333333
  warning-minutes: [2, 1]
  search-radius: 4096
  world: ''
  x: 0.0
  y: 64.0
  z: 0.0
  yaw: 0.0
  broadcast: true
  messages:
    warning: 'Cyborg Father Yeti spawns in {minutes} minutes at {location}.'
    spawn: 'Cyborg Father Yeti has spawned at {location}!'
    defeat: 'Cyborg Father Yeti was defeated at {location}!'
    despawn: 'The Yeti encounter ended at {location}.'
    skipped: 'The scheduled Yeti spawn was skipped: {reason}.'
discord:
  enabled: false
  webhook-url: ''
  title: 'YetiBoss — {event}'
  events:
    warning: true
    spawn: true
    defeat: true
    despawn: true
    skipped: true
  messages:
    warning: 'Spawn in **{minutes} minutes** at {location}.\nNext spawn: {next_spawn}'
    spawn: '**Cyborg Father Yeti has appeared!**\nArena: {location}\nNext spawn: {next_spawn}'
    defeat: '**Cyborg Father Yeti was defeated!**\nArena: {location}\nNext spawn: {next_spawn}'
    despawn: 'Encounter ended at {location}.\nNext spawn: {next_spawn}'
    skipped: 'Scheduled spawn skipped: {reason}\nNext spawn: {next_spawn}'
