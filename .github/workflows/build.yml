name: Build YetiBoss
run-name: "YetiBoss 0.9.7 — Sequenced combat and frost pressure"
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: python3 -m unittest discover -s resource-pack -p 'test_*.py'
      - run: python3 resource-pack/build_pack.py
      - run: python3 resource-pack/build_bedrock.py
      - run: mvn --batch-mode --no-transfer-progress verify
      - name: Publish pack matching this build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pack_digest=$(tr -d '\r\n' < target/yeti-pack.sha1)
          cp target/YetiBoss-Pack.zip "target/YetiBoss-Pack-${pack_digest}.zip"
          if ! gh release view yeti-pack-assets >/dev/null 2>&1; then
            gh release create yeti-pack-assets --target "$GITHUB_SHA" --title "Versioned YetiBoss packs" --notes "Pack downloads keyed by the SHA-1 embedded in each plugin build." --latest=false
          fi
          gh release upload yeti-pack-assets "target/YetiBoss-Pack-${pack_digest}.zip" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: YetiBoss
          path: |
            target/YetiBoss-*.jar
            target/YetiBoss-Pack.zip
            target/yeti-pack.sha1
            target/YetiBoss-Bedrock.mcpack
            target/yetiboss-geyser-mappings.json
            target/yetiboss-display-mappings.yml
          if-no-files-found: error
      - name: Publish original Giant Yeti pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view yeti-pack >/dev/null 2>&1; then
            gh release create yeti-pack --target "$GITHUB_SHA" --title "Giant Yeti resource packs" --notes "Original Java and Bedrock boss models, animation poses, and Geyser mappings." --latest=false
          fi
          gh release upload yeti-pack target/YetiBoss-Pack.zip target/yeti-pack.sha1 target/YetiBoss-Bedrock.mcpack target/yetiboss-geyser-mappings.json target/yetiboss-display-mappings.yml --clobber
